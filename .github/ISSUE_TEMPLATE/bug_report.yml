name: Bug report
description: Something in LizTerm does not work, or does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The fields below are the ones that usually decide
        whether a bug can be reproduced without a follow-up question.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        What you did, what LizTerm did, and what you expected instead. A screenshot of the window helps, especially
        when the screen and the status bar disagree; drop it in here.
      placeholder: |
        1. Connected to my MVS 3.8j host over TLS
        2. Chose File > Transfer...
        3. LizTerm reported "..." and the transfer stopped

        I expected the file to arrive in my dataset.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true

  - type: input
    id: lizterm-version
    attributes:
      label: LizTerm version
      description: >
        Shown in **About LizTerm** — the Help menu in a session window, or the LizTerm menu on macOS. The line can be
        copied. A build from source reads `0.7.0-DEV (a1b2c3d)`; include the commit.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: How you installed it
      description: The file you downloaded from the Releases page.
      options:
        - macOS disk image (.dmg)
        - macOS zip
        - Linux .deb
        - Linux .rpm
        - Linux zip
        - Windows installer (.exe)
        - Windows zip
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system, processor and language
      description: >
        Say whether the machine is Apple Silicon or Intel, x64 or ARM64, and which language your desktop runs in:
        the language decides things like the decimal separator and the keyboard layout, and has caused a bug before.
      placeholder: "macOS 15.2, Apple Silicon, English / Linux Mint 22.1, x64, German / Windows 11 24H2, ARM64, English"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host and its type
      description: >
        What you are connecting to. Do not include a public address you would rather not publish. For a problem in
        mvsMF Access, add the mvsMF version too.
      placeholder: "MVS 3.8j (TK5) on my LAN / VM/370 / z/OS 3.1 / MVS 3.8j with mvsMF 1.1.0"
    validations:
      required: true

  - type: dropdown
    id: tls
    attributes:
      label: Is TLS in use?
      options:
        - "No — plain TN3270"
        - "Yes, verified against system roots"
        - "Yes, with a pinned certificate"
        - "Yes, with Verify host certificate turned off in the profile"
        - "Yes, by choosing Connect Anyway after the certificate warning"
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine source
      description: >
        The engine line of **About LizTerm**, under the version. "Bundled" is the b3270 that shipped with LizTerm and is
        what almost everyone has; "Override" means LIZTERM_B3270_PATH is set.
      options:
        - Bundled
        - Override
        - Unknown
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Profile settings you changed from the defaults (optional)
      description: >
        Model, a custom screen size, Mono (3278), extended data stream, code page, LU name, keep-alive, and any
        keyboard bindings you changed under **Preferences > Keyboard**. Leave it empty if you changed nothing.
      placeholder: "Model 4, code page bracket, Ctrl+Home bound to PA1"

  - type: textarea
    id: wire-log
    attributes:
      label: Wire log (optional, but it helps a lot)
      description: >
        Turn on **Help > Wire Log** in the session window, reproduce the problem, turn it off, and drop the file in
        here (**Help > Show Wire Logs...** opens the folder). Turn it on before you connect if the problem happens at
        connect time; the log starts from the moment it is turned on. It covers the terminal session only, not
        mvsMF Access.
        **A wire log records everything you type, including passwords** — check it before you share it.
