name: Platforms

on:
  push:
    branches: [main]
  # Both jobs run the whole solution, so their coverage depends on every source and test file, not just the
  # native build: a Windows- or macOS-only defect anywhere in src/ or tests/ must be caught before merge, not
  # by the push-to-main run afterwards.
  pull_request:
    paths:
      - .github/workflows/platforms.yml
      - native/**
      - src/**
      - tests/**
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LIZTERM_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned x3270 source tarball
        uses: actions/cache@v6
        with:
          path: native/cache
          key: x3270-src-${{ hashFiles('native/build/fetch-source.sh') }}

      # The compile, not just the download. Keyed on the scripts that actually feed THIS platform's engine:
      # its own build and verify scripts, the fetcher it uses, and everything shared. Hashing all of
      # native/build/*.sh instead would make a Linux-only edit rebuild the macOS engine (and the reverse),
      # neither of which can change the other platform's binary. New shared machinery is picked up by the
      # shared-* glob, so it cannot be added to one key and forgotten in the other.
      - name: Cache the built engine
        id: engine
        uses: actions/cache@v6
        with:
          path: native/out/osx-arm64
          key: b3270-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build/*macos*.sh', 'native/build/fetch-source.sh', 'native/build/shared-*.sh') }}

      - name: Ensure OpenSSL 3 is installed
        if: steps.engine.outputs.cache-hit != 'true'
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

      - name: Build b3270 (verify-macos.sh is the gate)
        if: steps.engine.outputs.cache-hit != 'true'
        run: native/build/build-macos.sh

      # build-macos.sh redirects configure and make into native/build-tmp/, which is gitignored and never
      # uploaded, so without this a build failure leaves nothing in the job log but the exit code.
      # cancelled() as well as failure(), for the reason the test-results upload below gives: timeout-minutes
      # and cancel-in-progress both cancel rather than fail, and a build wedged past the job timeout is exactly
      # the run whose logs are worth having.
      - name: Show the build logs
        if: ${{ failure() || cancelled() }}
        run: |
          for log in native/build-tmp/*/configure.log native/build-tmp/*/make.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      - name: Test (the engine smoke test must run, not skip)
        run: dotnet test LizTerm.slnx --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      # After the smoke test, so a binary that links cleanly but cannot be spawned is never published.
      - name: Upload b3270
        uses: actions/upload-artifact@v7
        with:
          name: b3270-osx-arm64
          path: native/out/osx-arm64/b3270
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

  engine-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 rather than ubuntu-latest: the two legs must differ only in architecture, and
          # ubuntu-latest rolling to 26.04 while the arm label stays at 24.04 would quietly make them
          # incomparable. arm64 standard runners reached private repositories in January 2026.
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # First cold-cache run (2026-09-07, PR #10): linux-x64 17m47s total, linux-arm64 4m35s. Both are under the
    # 20-minute threshold for lowering this, so 40 replaces the brief's 45 -- comfortably above double the
    # slower leg, with headroom rather than a bare double.
    # The x64 leg was slow almost entirely in package installation: every invocation of build-linux-docker.sh
    # reinstalls PACKAGES with dnf inside a fresh container (nothing from the first one's dnf run is cached),
    # and that install was far slower on the x64 runner than on the arm64 one in that run -- the two
    # negative-fixture steps it then had cost 279s and 281s against a 432s build. Folding them into the single
    # gate step below removed one of the three invocations. That was runner/network variance rather than
    # evidence that x64 needs longer to build the engine, so 40 keeps room for it to recur.
    # Cold-cache again after that fold (same PR): x64 678s total, arm64 238s -- the gate step 219s and 31s,
    # against 560s and 58s for the two steps it replaced. 40 is now generous, and deliberately so: the x64
    # variance that produced 1067s came from dnf, which is still on the critical path twice.
    timeout-minutes: 40
    env:
      LIZTERM_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      # Source tarballs are architecture-independent, so both legs share one entry. Two legs missing at once
      # means both download and one loses the save race with a warning, which is harmless.
      - name: Cache the pinned source tarballs
        uses: actions/cache@v6
        with:
          path: native/cache
          key: sources-${{ hashFiles('native/build/fetch-*.sh') }}

      # Keyed on the Linux build and verify scripts (linux-image.sh included, so changing the base image forces
      # a real build), the fetchers, and the shared machinery -- but not on the macOS scripts, which cannot
      # change this binary. See the macOS job's cache step for the rule.
      - name: Cache the built engine
        id: engine
        uses: actions/cache@v6
        with:
          path: native/out/${{ matrix.rid }}
          key: b3270-${{ matrix.rid }}-${{ hashFiles('native/build/*linux*.sh', 'native/build/fetch-*.sh', 'native/build/shared-*.sh') }}

      - name: Build b3270 (verify-linux.sh is the gate)
        if: steps.engine.outputs.cache-hit != 'true'
        run: native/build/build-linux-docker.sh

      # build-linux.sh redirects configure, make and the OpenSSL and expat builds into native/build-tmp/, which
      # is gitignored and never uploaded, so without this a build failure leaves nothing in the job log but the
      # exit code.
      # cancelled() as well as failure(), for the reason the test-results upload below gives: timeout-minutes
      # and cancel-in-progress both cancel rather than fail, and a build wedged past the job timeout is exactly
      # the run whose logs are worth having.
      - name: Show the build logs
        if: ${{ failure() || cancelled() }}
        run: |
          for log in native/build-tmp/*/openssl.log native/build-tmp/*/expat.log native/build-tmp/*/configure.log native/build-tmp/*/make.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      # Both of these run whether or not the engine came from the cache. On a cache hit the build step never
      # executes, so they are the only thing standing between a stale cached binary and an artifact upload --
      # which is why the step below runs the gate against the built binary and not only against the fixtures.
      # They are separate steps because they are separate claims: this one runs on the host and starts the
      # engine in a bare floor container, the next runs inside the build container and inspects it.
      - name: The engine starts on a bare floor system
        run: native/build/verify-linux-start.sh native/out/${{ matrix.rid }}/b3270

      # A guard that cannot fail is not a guard (plan 3b, deviation 5) -- and neither is a check on the guard
      # that passes for any non-zero exit. build-linux-docker.sh exits non-zero for a Docker Hub rate limit, a
      # failed dnf install (which is its own `exit 1`) or a network hiccup, so asserting only "it exited
      # non-zero" reported every one of those as "the gate rejected the fixture". Each arm is therefore
      # asserted on the message that arm prints. One container invocation, three runs of the gate: one accept,
      # two rejects, instead of three invocations each paying the wrapper's dnf install again.
      - name: The gate accepts the engine and rejects both fixtures
        run: |
          mkdir -p native/build-tmp
          # debian 12 is glibc 2.36, so its /bin/true imports __libc_start_main@GLIBC_2.34 -- above our 2.28
          # floor -- while linking nothing but the glibc runtime: it passes the allowlist arm and must fail the
          # floor arm. Pinned by digest for the same reason the build image is, and to the multi-architecture
          # *index* digest so both legs resolve. It is deliberately not in linux-image.sh: that file is hashed
          # into the engine cache key, and a fixture image has nothing to do with how the engine is built.
          docker run --rm -v "$PWD/native/build-tmp:/out" \
            debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            cp /bin/true /out/newglibc-fixture
          # Single quotes on purpose: every $ below is for the container shell, not this one. Only the
          # matrix expression is substituted here, by Actions, before either shell sees the text.
          # shellcheck disable=SC2016
          native/build/build-linux-docker.sh bash -c '
          set -euo pipefail

          echo "--- the gate must accept the engine it is gating"
          native/build/verify-linux.sh native/out/${{ matrix.rid }}/b3270

          # Capture the output and match it; do not pipe it. grep -q exits on its first match and SIGPIPEs the
          # writer, which under this pipefail becomes 141 -- the trap that already cost this script family a
          # head -3 (see verify-linux.sh).
          reject() {
            echo "--- the gate must reject $2 by its $1"
            if output=$(native/build/verify-linux.sh "$2" 2>&1); then
              printf "%s\n" "$output"
              echo "FAILED: verify-linux.sh accepted $2; its $1 is not working" >&2
              exit 1
            fi
            printf "%s\n" "$output"
            case "$output" in
              *"$3"*) echo "OK: rejected by the $1" ;;
              *) echo "FAILED: verify-linux.sh rejected $2, but not by its $1 (nothing matched: $3)" >&2
                 exit 1 ;;
            esac
          }

          reject "dependency allowlist" /usr/bin/bash "dynamic dependencies outside the glibc runtime"
          reject "glibc symbol floor" native/build-tmp/newglibc-fixture "above the 2.28 floor"
          '

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      # linux-x64 is already covered end to end by ci.yml's `test` job -- same OS, same architecture, same two
      # commands -- so this leg runs only the project that needs the bundled engine. linux-arm64 is a platform
      # nothing else builds or tests, so it keeps the whole solution, which is what the path filter's coverage
      # of all of src/ and tests/ is for.
      # An expression rather than a third matrix.include property: GitHub renders every one of those in the
      # check name, and adding one would rewrite the two names a branch-protection rule has to spell out.
      - name: Test (the engine smoke test must run, not skip)
        run: dotnet test ${{ matrix.rid == 'linux-x64' && 'tests/LizTerm.Integration.Tests' || 'LizTerm.slnx' }} --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      # After the smoke test, so a binary that links cleanly but cannot be spawned is never published.
      - name: Upload b3270
        uses: actions/upload-artifact@v7
        with:
          name: b3270-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/b3270
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      - name: Test
        run: dotnet test LizTerm.slnx --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore
