name: Platforms

on:
  # Push to main is path-filtered to what feeds the engine caches, and nothing else. actions/cache scopes an
  # entry to the branch that saved it plus the default branch, so a PR run can restore what main saved but
  # main can never restore what a PR saved: the run on main is what turns a PR's cold engine build into the
  # warm cache every later PR hits. That is only needed when the cache key inputs -- the native/build scripts
  # and these two workflows -- have changed. On every other merge the PR run already exercised this same
  # tree on every platform (pull_request runs against the merge with main), so a second run on main was
  # ~55 billed minutes per merge for a result already in hand. ci.yml's `test` still runs on every push to
  # main, and release.yml calls engines.yml itself, so a tag is gated on every platform regardless.
  # One consequence to know: a cache entry unused for seven days is evicted. After an idle stretch the first
  # PR builds cold in its own scope, and main stays cold until a native/ change lands or someone dispatches
  # this workflow on main by hand, which is the cheap way to re-warm it.
  push:
    branches: [main]
    paths:
      - .github/workflows/platforms.yml
      - .github/workflows/engines.yml
      - native/**
  # The engine jobs run the whole solution, so their coverage depends on every source and test file, not just
  # the native build: a Windows- or macOS-only defect anywhere in src/ or tests/ must be caught before merge,
  # not by the push-to-main run afterwards.
  pull_request:
    paths:
      - .github/workflows/platforms.yml
      - .github/workflows/engines.yml
      - native/**
      - src/**
      - tests/**
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The engine jobs live in engines.yml so that release.yml can call the same ones. Two definitions of "an
  # engine proven to start" is the drift plan 3d's two-name artifact hop exists to prevent.
  engines:
    uses: ./.github/workflows/engines.yml
