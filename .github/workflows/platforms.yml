name: Platforms

on:
  push:
    branches: [main]
  # The engine jobs run the whole solution, so their coverage depends on every source and test file, not just
  # the native build: a Windows- or macOS-only defect anywhere in src/ or tests/ must be caught before merge,
  # not by the push-to-main run afterwards.
  pull_request:
    paths:
      - .github/workflows/platforms.yml
      - .github/workflows/engines.yml
      - native/**
      - src/**
      - tests/**
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The engine jobs live in engines.yml so that release.yml can call the same ones. Two definitions of "an
  # engine proven to start" is the drift plan 3d's two-name artifact hop exists to prevent.
  engines:
    uses: ./.github/workflows/engines.yml
