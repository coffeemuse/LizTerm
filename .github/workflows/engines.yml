name: Engines

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One job for both macOS engines rather than a two-leg matrix, and deliberately so: macOS minutes bill at
  # ten times Linux and every job is rounded up to a whole minute, so two warm legs of 60-90 s each cost four
  # billed macOS minutes (40 Linux-equivalent); the one job measured 55 s warm on its first run (34553801730),
  # so it costs one (10). Both legs ran on this same
  # arm64 runner anyway -- osx-x64 is a cross build, because macos-13 is retired and macos-15-intel is the
  # last x86_64 image GitHub will offer, ending August 2027, and a native leg would inherit that date as its
  # own expiry -- so nothing about the machine changes, only how many times it is spun up. The old osx-x64
  # leg also ran its own setup-dotnet and solution build; on the same OS, SDK and tree as the osx-arm64 leg
  # that was 41 s of its 66 s proving nothing the other leg did not, and it did not even copy the x64 engine,
  # since a RID-less build keys the copy on the host RID. What the x64 half uniquely proves is its engine's
  # gate, and that is all it does here.
  # The price is that a cold run builds the two engines one after the other rather than side by side (the
  # source tarball cache is one directory both builds fetch into, so they are not run concurrently), and that
  # one leg's failure now fails the other's upload too, where fail-fast: false used to keep them apart.
  engine-macos:
    runs-on: macos-15
    # 20, from the worst cold legs seen while they were separate jobs: 225 s for osx-arm64 and 311 s for
    # osx-x64, each including the ~45 s of setup-dotnet and solution build that now happens once. Sequential,
    # that is about 8 minutes cold; 20 is ~2.5x that. The old 30 was set when each leg was its own job, and
    # at ten billed minutes per wall minute a wedged job is exactly where a generous timeout costs the most.
    timeout-minutes: 20
    env:
      LIZTERM_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      # macOS's own key, not the x3270-src- one engine-windows uses: this job fetches OpenSSL as well as
      # x3270, and that expression hashes the same one script whichever job evaluates it. Sharing it would let
      # engine-windows -- which fetches only x3270 -- save a one-tarball cache under a key this job also
      # resolves to, giving this job an exact hit on a subset and a re-download of OpenSSL on every run until
      # a fetcher edit rotates the key. A subset saved under a shared key cannot be repaired by the job that
      # needs the rest. Both engines share this entry: source tarballs are architecture-independent.
      - name: Cache the pinned source tarballs
        uses: actions/cache@v6
        with:
          path: native/cache
          key: sources-macos-${{ hashFiles('native/build/fetch-source.sh', 'native/build/fetch-openssl.sh') }}

      # One cache entry per engine, keyed on the RID: the two are different binaries built from the same
      # scripts, and one job restoring both is what lets each hit or miss on its own. fetch-openssl.sh is in
      # the key because macOS links OpenSSL from that pin -- without it, a bumped OpenSSL rebuilds Linux and
      # silently reuses a cached Mac engine linking the old one.
      - name: Cache the built osx-arm64 engine
        id: arm64
        uses: actions/cache@v6
        with:
          path: native/out/osx-arm64
          key: b3270-osx-arm64-${{ hashFiles('native/build/*macos*.sh', 'native/build/fetch-source.sh', 'native/build/fetch-openssl.sh', 'native/build/shared-*.sh', 'native/patches/**') }}

      - name: Cache the built osx-x64 engine
        id: x64
        uses: actions/cache@v6
        with:
          path: native/out/osx-x64
          key: b3270-osx-x64-${{ hashFiles('native/build/*macos*.sh', 'native/build/fetch-source.sh', 'native/build/fetch-openssl.sh', 'native/build/shared-*.sh', 'native/patches/**') }}

      # verify-macos.sh's TLS arm runs the binary to read its banner, and the osx-x64 binary is x86_64 on this
      # arm64 runner. Idempotent: a no-op if the image already ships Rosetta (2 s when it does).
      - name: Rosetta, so the x86_64 gate can run its binary
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Build b3270 for osx-arm64 (verify-macos.sh is the gate)
        if: steps.arm64.outputs.cache-hit != 'true'
        run: native/build/build-macos.sh osx-arm64

      - name: Build b3270 for osx-x64 (verify-macos.sh is the gate)
        if: steps.x64.outputs.cache-hit != 'true'
        run: native/build/build-macos.sh osx-x64

      # build-macos.sh redirects configure and make into native/build-tmp/<rid>/, which is gitignored and never
      # uploaded, so without this a build failure leaves nothing in the job log but the exit code.
      # cancelled() as well as failure(), for the reason the test-results upload below gives: timeout-minutes
      # and cancel-in-progress both cancel rather than fail, and a build wedged past the job timeout is exactly
      # the run whose logs are worth having.
      - name: Show the build logs
        if: ${{ failure() || cancelled() }}
        run: |
          for log in native/build-tmp/*/openssl.log native/build-tmp/*/configure.log native/build-tmp/*/make.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      # Runs for both engines whether or not each came from the cache. On a cache hit the build step never
      # executes, so this is the only thing between a stale cached binary and an artifact upload -- the reason
      # engine-linux and engine-windows each run their gate unconditionally too.
      #
      # Both fixtures are compiled here rather than picked off the disk. #13 proposed /opt/homebrew/bin/openssl
      # for the dependency arm, on the grounds that build-macos.sh requires Homebrew openssl@3 -- that stopped
      # being true when OpenSSL moved to the pinned tarball. It proposed /bin/echo for the TLS arm, but
      # verify-macos.sh checks the machine type FIRST and lipo reports /bin/echo as "x86_64 arm64e" against a
      # uname of arm64, so it dies at the architecture arm and never reaches the one it was chosen to prove.
      # That is not specific to echo: every macOS platform binary is universal with an arm64e slice, so none
      # can serve here. cc is guaranteed instead, because Xcode CLT is already a hard requirement of
      # build-macos.sh -- and engine-windows builds its own import fixture the same way.
      - name: The gate accepts each engine and rejects every fixture for each architecture
        run: |
          set -euo pipefail

          # Capture and match; do not pipe. grep -q exits on its first match and SIGPIPEs the writer, which
          # under pipefail becomes 141 -- the trap this script family has already paid for once.
          reject() {
            echo "--- the gate must reject $2 by its $1"
            if output=$(native/build/verify-macos.sh "$2" "$ARCH" 2>&1); then
              printf "%s\n" "$output"
              echo "FAILED: verify-macos.sh accepted $2; its $1 is not working" >&2
              exit 1
            fi
            printf "%s\n" "$output"
            case "$output" in
              *"$3"*) echo "OK: rejected by the $1" ;;
              *) echo "FAILED: verify-macos.sh rejected $2, but not by its $1 (nothing matched: $3)" >&2
                 exit 1 ;;
            esac
          }

          for leg in "osx-arm64 arm64" "osx-x64 x86_64"; do
            read -r RID ARCH <<<"$leg"
            echo "::group::$RID ($ARCH)"

            # Fixtures built for the engine's own architecture, in their own directory per architecture, so
            # both clear the machine-type arm and reach the arm each is meant to prove. For osx-x64 these are
            # x86_64 binaries on an arm64 runner; the Rosetta step above is what lets the TLS arm execute one.
            FIX=native/build-tmp/fixtures/$ARCH
            mkdir -p "$FIX"
            cat > "$FIX/clean.c" <<'EOF'
          int main(void) { return 0; }
          EOF
            cat > "$FIX/lib.c" <<'EOF'
          int fixture(void) { return 0; }
          EOF
            cat > "$FIX/uses-lib.c" <<'EOF'
          int fixture(void);
          int main(void) { return fixture(); }
          EOF

            # clean: links only libSystem and exits 0 with no banner -- clears architecture and dependency, dies at TLS.
            cc -arch "$ARCH" -o "$FIX/clean" "$FIX/clean.c"
            # dirty: an install_name outside /usr/lib and /System/Library -- clears architecture, dies at dependency.
            cc -arch "$ARCH" -dynamiclib -install_name "@executable_path/libfixture.dylib" -o "$FIX/libfixture.dylib" "$FIX/lib.c"
            cc -arch "$ARCH" -o "$FIX/dirty" "$FIX/uses-lib.c" -L"$FIX" -lfixture
            # unpatched: the real engine with its patch marker defaced -- clears every other arm, dies at the patch
            # marker. Re-signed ad hoc: an arm64 binary whose signature no longer matches its bytes is killed when
            # the TLS arm runs it, and would be rejected by the wrong arm.
            perl -0777 -pe 's/CommandPrefix/CommandPrefiX/g' "native/out/$RID/b3270" > "$FIX/unpatched"
            chmod +x "$FIX/unpatched"
            codesign -f -s - "$FIX/unpatched"

            echo "--- the gate must accept the engine it is gating"
            native/build/verify-macos.sh "native/out/$RID/b3270" "$ARCH"

            reject "dependency allowlist" "$FIX/dirty"     "non-system dynamic dependencies"
            reject "TLS provider check"   "$FIX/clean"     "does not report the expected TLS provider"
            reject "patch marker check"   "$FIX/unpatched" "does not carry LizTerm"
            echo "::endgroup::"
          done

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      # The whole solution, once. A RID-less build copies the host RID's engine -- osx-arm64 on this runner --
      # so this is the arm64 engine being spawned; osx-x64 cannot be run through the suite here at all, and
      # the architecture assertion in the gate step above is what proves that binary, as the spec records.
      - name: Test (the engine smoke test must run, not skip)
        run: dotnet test LizTerm.slnx --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      # After the smoke test, so a binary that links cleanly but cannot be spawned is never published.
      - name: Upload b3270 (osx-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: b3270-osx-arm64
          path: native/out/osx-arm64/b3270
          if-no-files-found: error
          retention-days: 14

      - name: Upload b3270 (osx-x64)
        uses: actions/upload-artifact@v7
        with:
          name: b3270-osx-x64
          path: native/out/osx-x64/b3270
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

  engine-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 rather than ubuntu-latest: the two legs must differ only in architecture, and
          # ubuntu-latest rolling to 26.04 while the arm label stays at 24.04 would quietly make them
          # incomparable. arm64 standard runners reached private repositories in January 2026.
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # 15, from three cold-cache runs on PR #10 (2026-09-07), each after a change that took work off the
    # critical path. Every number below is a cold run -- in the last one every cache missed and all seven source
    # tarballs were downloaded, so it is the worst case, not a partial. Warm runs have never exceeded 2m31s.
    #
    #   x64    arm64   what had changed
    #   1067s   275s   as first shipped: three container invocations per leg, each re-running dnf install.
    #                  Of the x64 leg, the two negative-fixture steps took 279s and 281s against a 432s build.
    #    678s   238s   the two fixture steps folded into one gate step (219s and 31s, from 560s and 58s),
    #                  removing one of the three invocations -- and so one dnf install -- per leg.
    #    271s   210s   dnf install moved into a derived image built once per job, and the x64 leg scoped to
    #                  tests/LizTerm.Integration.Tests. Build step 201s and 137s (~36s of it the image),
    #                  gate step 4s on both, down from 219s and 31s.
    #
    # The x64 variance that produced 1067s was dnf on the critical path twice; it is now one cached layer, and
    # the two legs have converged, which is what a build cost rather than a network cost looks like. 15 is
    # ~3.3x the slowest leg observed -- room for the runners to have a bad day, without the old 40 that could
    # let a genuinely wedged build burn most of an hour before anyone hears about it.
    timeout-minutes: 15
    env:
      LIZTERM_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      # Source tarballs are architecture-independent, so both legs share one entry. Two legs missing at once
      # means both download and one loses the save race with a warning, which is harmless.
      - name: Cache the pinned source tarballs
        uses: actions/cache@v6
        with:
          path: native/cache
          key: sources-${{ hashFiles('native/build/fetch-*.sh') }}

      # Keyed on the Linux build and verify scripts (linux-image.sh included, so changing the base image forces
      # a real build), the fetchers, and the shared machinery -- but not on the macOS scripts, which cannot
      # change this binary. See the macOS job's cache step for the rule.
      - name: Cache the built engine
        id: engine
        uses: actions/cache@v6
        with:
          path: native/out/${{ matrix.rid }}
          key: b3270-${{ matrix.rid }}-${{ hashFiles('native/build/*linux*.sh', 'native/build/fetch-*.sh', 'native/build/shared-*.sh', 'native/patches/**') }}

      - name: Build b3270 (verify-linux.sh is the gate)
        if: steps.engine.outputs.cache-hit != 'true'
        run: native/build/build-linux-docker.sh

      # build-linux.sh redirects configure, make and the OpenSSL and expat builds into native/build-tmp/, which
      # is gitignored and never uploaded, so without this a build failure leaves nothing in the job log but the
      # exit code.
      # cancelled() as well as failure(), for the reason the test-results upload below gives: timeout-minutes
      # and cancel-in-progress both cancel rather than fail, and a build wedged past the job timeout is exactly
      # the run whose logs are worth having.
      - name: Show the build logs
        if: ${{ failure() || cancelled() }}
        run: |
          for log in native/build-tmp/*/openssl.log native/build-tmp/*/expat.log native/build-tmp/*/configure.log native/build-tmp/*/make.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      # Both of these run whether or not the engine came from the cache. On a cache hit the build step never
      # executes, so they are the only thing standing between a stale cached binary and an artifact upload --
      # which is why the step below runs the gate against the built binary and not only against the fixtures.
      # They are separate steps because they are separate claims: this one runs on the host and starts the
      # engine in a bare floor container, the next runs inside the build container and inspects it.
      - name: The engine starts on a bare floor system
        run: native/build/verify-linux-start.sh native/out/${{ matrix.rid }}/b3270

      # A guard that cannot fail is not a guard (plan 3b, deviation 5) -- and neither is a check on the guard
      # that passes for any non-zero exit. build-linux-docker.sh exits non-zero for a Docker Hub rate limit, a
      # failed dnf install (which is its own `exit 1`) or a network hiccup, so asserting only "it exited
      # non-zero" reported every one of those as "the gate rejected the fixture". Each arm is therefore
      # asserted on the message that arm prints. One container invocation, four runs of the gate: one accept,
      # three rejects, instead of four invocations each paying the wrapper's dnf install again.
      - name: The gate accepts the engine and rejects every fixture
        run: |
          mkdir -p native/build-tmp
          # debian 12 is glibc 2.36, so its /bin/true imports __libc_start_main@GLIBC_2.34 -- above our 2.28
          # floor -- while linking nothing but the glibc runtime: it passes the allowlist arm and must fail the
          # floor arm. Pinned by digest for the same reason the build image is, and to the multi-architecture
          # *index* digest so both legs resolve. It is deliberately not in linux-image.sh: that file is hashed
          # into the engine cache key, and a fixture image has nothing to do with how the engine is built.
          docker run --rm -v "$PWD/native/build-tmp:/out" \
            debian:12-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171 \
            cp /bin/true /out/newglibc-fixture
          # Single quotes on purpose: every $ below is for the container shell, not this one. Only the
          # matrix expression is substituted here, by Actions, before either shell sees the text.
          # shellcheck disable=SC2016
          native/build/build-linux-docker.sh bash -c '
          set -euo pipefail

          echo "--- the gate must accept the engine it is gating"
          native/build/verify-linux.sh native/out/${{ matrix.rid }}/b3270

          # Capture the output and match it; do not pipe it. grep -q exits on its first match and SIGPIPEs the
          # writer, which under this pipefail becomes 141 -- the trap that already cost this script family a
          # head -3 (see verify-linux.sh).
          reject() {
            echo "--- the gate must reject $2 by its $1"
            if output=$(native/build/verify-linux.sh "$2" 2>&1); then
              printf "%s\n" "$output"
              echo "FAILED: verify-linux.sh accepted $2; its $1 is not working" >&2
              exit 1
            fi
            printf "%s\n" "$output"
            case "$output" in
              *"$3"*) echo "OK: rejected by the $1" ;;
              *) echo "FAILED: verify-linux.sh rejected $2, but not by its $1 (nothing matched: $3)" >&2
                 exit 1 ;;
            esac
          }

          reject "dependency allowlist" /usr/bin/bash "dynamic dependencies outside the glibc runtime"
          reject "glibc symbol floor" native/build-tmp/newglibc-fixture "above the 2.28 floor"

          # The real engine with its patch marker defaced: it clears every other arm and dies at the patch marker.
          perl -0777 -pe "s/CommandPrefix/CommandPrefiX/g" native/out/${{ matrix.rid }}/b3270 > native/build-tmp/unpatched-fixture
          chmod +x native/build-tmp/unpatched-fixture
          reject "patch marker check" native/build-tmp/unpatched-fixture "does not carry LizTerm"
          '

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      # linux-x64 is already covered end to end by ci.yml's `test` job -- same OS, same architecture, same two
      # commands -- so this leg runs only the project that needs the bundled engine. linux-arm64 is a platform
      # nothing else builds or tests, so it keeps the whole solution, which is what the path filter's coverage
      # of all of src/ and tests/ is for.
      # An expression rather than a third matrix.include property: GitHub renders every one of those in the
      # check name, and adding one would rewrite the two names a branch-protection rule has to spell out.
      - name: Test (the engine smoke test must run, not skip)
        run: dotnet test ${{ matrix.rid == 'linux-x64' && 'tests/LizTerm.Integration.Tests' || 'LizTerm.slnx' }} --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      # After the smoke test, so a binary that links cleanly but cannot be spawned is never published.
      - name: Upload b3270
        uses: actions/upload-artifact@v7
        with:
          name: b3270-${{ matrix.rid }}
          path: native/out/${{ matrix.rid }}/b3270
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore

  engine-windows:
    runs-on: ubuntu-24.04
    # 8, from two runs on PR #11 (2026-09-08): 152s cold (34220119068/34220119073, every cache missed, the
    # source tarball downloaded, the derived image built) and 48s warm (34226268415, engine restored from
    # cache). These are the only two runs in hand -- engine-linux's comment above has three cold-cache
    # measurements taken across successive changes to the build, and this job has had no such iteration to
    # measure, so there is no trend to report, only the two numbers. 8 is ~3.2x the slowest of them (152s),
    # matching engine-linux's ~3.3x ratio of timeout to worst cold run -- room for a bad day on the runner
    # without the old provisional 20, which could let a genuinely wedged build run more than twice as long as
    # the worst run actually observed.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      # Its own key, shaped like engine-macos's, not engine-linux's shared `sources-` entry: engine-linux fetches
      # three tarballs (x3270, OpenSSL, expat) and hashes all of fetch-*.sh to key them together, but this job
      # fetches only x3270, and that expression hashes the same three scripts regardless of which job evaluates
      # it -- so reusing it would give this job the identical key engine-linux uses. On a cold key, whichever of
      # this job and engine-macos finishes first (both are far cheaper than engine-linux) would save a
      # one-tarball native/cache under a key engine-linux's own hash also resolves to; engine-linux would then
      # get an exact hit on a cache holding a third of what it needs, restore that subset, and re-download
      # OpenSSL and expat on every run until a fetch-*.sh edit next rotates the key. A subset saved under a
      # shared key cannot be repaired by the jobs that need the rest, so the fix is a key of its own.
      - name: Cache the pinned x3270 source tarball
        uses: actions/cache@v6
        with:
          path: native/cache
          key: x3270-src-${{ hashFiles('native/build/fetch-source.sh') }}

      # Keyed on the Windows scripts (windows-image.sh included, so changing the base image forces a real
      # build), the x3270 fetcher, and the shared machinery -- but not on the Linux or macOS scripts, which
      # cannot change this binary.
      - name: Cache the built engine
        id: engine
        uses: actions/cache@v6
        with:
          path: native/out/win-x64
          key: b3270-win-x64-${{ hashFiles('native/build/*windows*.sh', 'native/build/fetch-source.sh', 'native/build/shared-*.sh', 'native/patches/**') }}

      - name: Build b3270.exe (verify-windows.sh is the gate)
        if: steps.engine.outputs.cache-hit != 'true'
        run: native/build/build-windows-docker.sh

      # build-windows.sh redirects configure and make into native/build-tmp/, which is gitignored and never
      # uploaded, so without this a build failure leaves nothing in the job log but the exit code. cancelled()
      # as well as failure(): timeout-minutes and cancel-in-progress both cancel rather than fail, and a build
      # wedged past the job timeout is exactly the run whose logs are worth having.
      - name: Show the build logs
        if: ${{ failure() || cancelled() }}
        run: |
          for log in native/build-tmp/win-x64/configure.log native/build-tmp/win-x64/make.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 200 "$log"
            echo "::endgroup::"
          done

      # Runs whether or not the engine came from the cache: on a cache hit the build step never executes, so
      # this and the Windows-side start check below are all that stand between a stale cached binary and a
      # published artifact -- which is why it runs the gate against the built binary and not only the fixture.
      # Each arm is asserted on the message it prints, never on a bare non-zero exit: the wrapper also exits
      # non-zero for a Docker Hub rate limit or a failed apt-get install, and asserting only "it failed" would
      # report every one of those as a successful rejection.
      - name: The gate accepts the engine and rejects a non-system import and an unpatched engine
        run: |
          mkdir -p native/build-tmp/fixtures
          cat > native/build-tmp/fixtures/dll.c <<'EOF'
          __declspec(dllexport) int fixture(void) { return 0; }
          EOF
          cat > native/build-tmp/fixtures/uses-dll.c <<'EOF'
          __declspec(dllimport) int fixture(void);
          int main(void) { return fixture(); }
          EOF
          native/build/build-windows-docker.sh bash -c '
            set -u
            native/build/verify-windows.sh native/out/win-x64/b3270.exe || { echo "the gate rejected the engine"; exit 1; }
            cd native/build-tmp/fixtures
            x86_64-w64-mingw32-gcc -shared -o libfixture.dll dll.c -Wl,--out-implib,libfixture.dll.a
            x86_64-w64-mingw32-gcc -o dirty.exe uses-dll.c -L. -lfixture
            cd /src
            if OUT=$(native/build/verify-windows.sh native/build-tmp/fixtures/dirty.exe 2>&1); then
              echo "the gate ACCEPTED a binary importing libfixture.dll"; exit 1
            fi
            case "$OUT" in
              *"imports DLLs outside the Windows system set"*) echo "OK: the import arm rejected its fixture" ;;
              *) echo "the fixture was rejected, but not by the import arm:"; printf "%s\n" "$OUT"; exit 1 ;;
            esac
            # The real engine with its patch marker defaced: it clears every other arm and dies at the patch marker.
            # debian:12-slim ships perl as an essential package.
            perl -0777 -pe "s/CommandPrefix/CommandPrefiX/g" native/out/win-x64/b3270.exe > native/build-tmp/fixtures/unpatched.exe
            if OUT=$(native/build/verify-windows.sh native/build-tmp/fixtures/unpatched.exe 2>&1); then
              echo "the gate ACCEPTED an engine without the patch marker"; exit 1
            fi
            case "$OUT" in
              *"does not carry LizTerm"*) echo "OK: the patch marker arm rejected its fixture" ;;
              *) echo "the fixture was rejected, but not by the patch marker arm:"; printf "%s\n" "$OUT"; exit 1 ;;
            esac
          '

      # Deliberately named -unverified. Nothing has yet started this binary: a PE file cannot run on this
      # runner, and plan 3c's rule is that a binary which links but cannot be spawned is never published.
      # test-windows re-uploads it under its real name once it has run it.
      - name: Upload b3270.exe (not yet started anywhere)
        uses: actions/upload-artifact@v7
        with:
          name: b3270-win-x64-unverified
          path: native/out/win-x64/b3270.exe
          if-no-files-found: error
          retention-days: 14

  test-windows:
    runs-on: windows-latest
    # The engine is built on Linux because x3270 cross-compiles for Windows and this runner has no toolchain.
    # The consequence is accepted deliberately: an engine-windows failure costs the Windows behavioural signal
    # too. ci.yml's `test` still runs the whole suite on every pull request, so what is lost is Windows-specific
    # behaviour only, and the coupling is what buys a start check on a real Windows machine.
    needs: engine-windows
    timeout-minutes: 20
    env:
      LIZTERM_REQUIRE_ENGINE: "1"
    steps:
      - uses: actions/checkout@v7

      # Into native/out/win-x64, which is exactly where the App csproj's Exists() condition looks, so the
      # existing copy rule puts it at runtimes/win-x64/native/b3270.exe with no project change. No chmod on the
      # way in, unlike the macOS and Linux engines: Windows has no executable bit for an artifact to lose.
      - name: Download the engine engine-windows built
        uses: actions/download-artifact@v7
        with:
          name: b3270-win-x64-unverified
          path: native/out/win-x64

      # The half of the gate that cannot run on the builder. shared-verify-tls.sh takes the expected provider
      # as its second argument; without it the script defaults to OpenSSL and would reject a correct engine.
      - name: The engine starts and reports Schannel
        shell: bash
        run: native/build/shared-verify-tls.sh native/out/win-x64/b3270.exe "Windows Schannel"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build LizTerm.slnx --configuration Release -warnaserror

      - name: Test (the engine smoke test must run, not skip)
        run: dotnet test LizTerm.slnx --configuration Release --no-build --blame-hang-timeout 5m --logger trx --results-directory TestResults

      # Only now, after a Windows machine has started it and the suite has spawned it through B3270Session,
      # does the binary get published under the name anything downstream would consume.
      - name: Upload b3270.exe
        uses: actions/upload-artifact@v7
        with:
          name: b3270-win-x64
          path: native/out/win-x64/b3270.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: |
            TestResults/**/*.trx
            TestResults/**/*.dmp
            TestResults/**/*Sequence*.xml
          if-no-files-found: ignore
